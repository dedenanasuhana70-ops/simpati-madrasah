<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14532D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SIMPATI Madrasah Tsanawiyah Cipasung</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #14532D; font-family: system-ui, sans-serif; }
    #splash { position: fixed; inset: 0; background: linear-gradient(145deg, #0F3D21, #14532D); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 20; transition: opacity 0.35s ease; }
    #splash img { width: 92px; height: 92px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    #splash.hide { opacity: 0; pointer-events: none; }
    iframe { width: 100%; height: 100dvh; border: none; display: block; background: #F0F7F4; }
    #installBar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #14532D; color: #fff; padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,0.28); display: none; align-items: center; gap: 12px; z-index: 30; font-size: 14px; }
    #installBar button { background: #F59E0B; color: #111; border: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icon-512.png" alt="Logo">
    <div style="font-weight:700;font-size:18px;">SIMPATI Madrasah Tsanawiyah Cipasung</div>
    <div style="font-size:13px;opacity:0.8;">Memuat aplikasi...</div>
  </div>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxmo9fGN73OyYcVpaqb6OKZ4VuBucZJoZyA2ko8zgU3NIBtW5rS5CzGt17aE8X1erUNkw/exec" allow="clipboard-write; fullscreen" onload="document.getElementById('splash').classList.add('hide')"></iframe>
  <div id="installBar">
    <span>Pasang ikon di layar HP?</span>
    <button id="btnInstallApp">Instal</button>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    }
    var deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("installBar").style.display = "flex";
    });
    document.getElementById("btnInstallApp").addEventListener("click", function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() {
        deferredPrompt = null;
        document.getElementById("installBar").style.display = "none";
      });
    });
    setTimeout(function(){ document.getElementById("splash").classList.add("hide"); }, 4500);
  </script>
</body>
</html>
